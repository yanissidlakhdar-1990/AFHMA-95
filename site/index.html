<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b0b0d">
  <meta name="color-scheme" content="dark light">
  <title>Haltéro 95 — Records & stats</title>
  <meta name="description" content="Résultats, records et stats des haltérophiles du Val d'Oise">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23e4002b'/><text x='50' y='70' font-family='Arial Black,Arial' font-weight='900' font-size='56' text-anchor='middle' fill='white'>95</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    // thème : choix mémorisé, sinon réglage du téléphone
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <header class="top">
    <a href="#/" class="brand"><span class="logo">95</span><span class="brand-txt">Haltéro<b>Val d'Oise</b></span></a>
    <nav class="nav">
      <a href="#/" data-nav="home">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg><span>Athlètes</span></a>
      <a href="#/records" data-nav="records">
        <svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"/></svg><span>Records du 95</span></a>
      <a href="#/derniers" data-nav="derniers">
        <svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></svg><span>Derniers records</span></a>
    </nav>
    <button class="theme" id="theme" type="button" aria-label="Changer de thème" title="Thème clair / sombre"><span class="sun">🌙</span><span class="moon">☀️</span></button>
  </header>
  <main id="app"><div class="loader"><span></span><span></span><span></span></div></main>
  <footer class="foot">
    <span id="updated"></span>
    <span>Données : <a href="https://scoresheet.ffhaltero.fr/scoresheet/" target="_blank" rel="noopener">scoresheet.ffhaltero.fr</a> · AFHMA Franconville · HFC CP95 Cergy · WIM LIFT</span>
  </footer>
  <div class="tip" id="tip" hidden></div>
  <script src="app.js"></script>
</body>
</html>
